schema_version: "1.1"
name: orders-endpoint-unverified-token
expected_outcome: |
  GET /me/orders returns only the caller's orders. Because the endpoint relies on readToken, which only decodes the token, the fix makes token checking verify the signature and expiry, so forged, tampered and expired tokens get 401. The reply explains the token weakness and the hardcoded fallback secret.
